name: ci

# PR + manual dispatch only — push triggers disabled to conserve Actions
# minutes during solo pre-launch work. Re-enable after June 1 reset if needed.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install dependencies
        run: bun install --frozen-lockfile 2>/dev/null || bun install

      - name: build
        run: bun run build.js

      - name: test
        run: bun test

      - name: check version sync
        run: bun tests/check-versions.js
