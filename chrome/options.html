<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>heatsync settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: monospace, 'Noto Color Emoji';
      font-size: 14px;
      max-width: 480px;
      margin: 0 auto;
      padding: 48px 24px;
      line-height: 1.6;
    }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .header img { width: 32px; height: 32px; }
    .header-title { font-size: 18px; font-weight: 600; }
    .card {
      border: 1px solid #333;
      padding: 18px 16px;
    }
    .card p { margin-bottom: 10px; color: #c0c0c0; }
    .gear { color: #ff8700; font-weight: 600; }
    ol { margin: 10px 0 0 18px; color: #c0c0c0; }
    ol li { margin-bottom: 4px; }
    .footer { margin-top: 28px; text-align: center; color: #a0a0a0; font-size: 11px; }
    .footer a { color: #ff8700; text-decoration: none; }
    .footer a:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon-48.png" alt="">
    <h1 class="header-title">heatsync settings</h1>
  </div>
  <div class="card">
    <p>settings now live inside the chat panel.</p>
    <ol>
      <li>open twitch, kick, or youtube</li>
      <li>click the <span class="gear">&#9881;</span> button in the heatsync panel</li>
      <li>pick a category from the icon row at the top</li>
    </ol>
  </div>
  <div class="footer">
    <a href="https://heatsync.org" target="_blank">heatsync.org</a> &middot;
    <a href="https://github.com/mellen9999/heatsync-extension" target="_blank">source</a>
  </div>
</body>
</html>
