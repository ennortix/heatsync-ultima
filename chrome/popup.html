<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=280">
  <title>heatsync</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      background: #000;
      color: #fff;
      font-family: monospace, 'Noto Color Emoji';
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #000;
    }
    .header img { width: 22px; height: 22px; }
    .header-title { font-size: 13px; font-weight: 600; flex: 1; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.green { background: #00cc66; }
    .status-dot.yellow { background: #ffcc00; }
    .status-dot.red { background: #ff4444; }

    /* search */
    .search-section { padding: 0 12px 6px; position: relative; }
    .search-input {
      width: 100%;
      padding: 7px 10px;
      background: rgba(255,255,255,0.06);
      border: none;
      color: #fff;
      font-size: 12px;
      font-family: inherit;
      outline: none;
    }
    .search-input::placeholder { color: #808080; }
    .search-dropdown {
      position: absolute;
      left: 16px; right: 16px; top: 100%;
      background: #111;
      border: 1px solid rgba(255,255,255,0.12);
      z-index: 100;
      max-height: 180px;
      overflow-y: auto;
      display: none;
    }
    .search-dropdown.open { display: block; }
    .search-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 12px;
      color: #ddd;
      text-decoration: none;
    }
    .search-item:hover { background: rgba(255,135,0,0.12); color: #ff8700; }
    .search-item-img {
      width: 22px; height: 22px; flex-shrink: 0;
      background: rgba(255,255,255,0.06);
    }
    .search-item-tag { color: #808080; font-size: 10px; margin-left: auto; flex-shrink: 0; }
    .search-empty { padding: 10px; color: #808080; font-size: 12px; }

    .user-section { padding: 6px 12px 2px; }
    .user-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .user-avatar {
      width: 28px; height: 28px;
      background: rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .user-name { font-weight: 600; font-size: 13px; }
    .user-stats { color: #a0a0a0; font-size: 11px; }
    .edit-profile-btn {
      margin-left: auto;
      font-size: 11px;
      color: #808080;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
      flex-shrink: 0;
    }
    .edit-profile-btn:hover { color: #ff8700; }

    /* profile edit inline form */
    .profile-edit-form {
      padding: 8px 0 4px;
      display: none;
    }
    .profile-edit-form.open { display: block; }
    .profile-edit-form textarea {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: none;
      color: #fff;
      font-size: 12px;
      font-family: inherit;
      padding: 6px 8px;
      resize: none;
      outline: none;
      height: 52px;
    }
    .profile-edit-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
    }
    .color-label { font-size: 11px; color: #a0a0a0; flex-shrink: 0; }
    .color-input {
      width: 28px; height: 22px;
      border: none;
      background: none;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }
    .color-hex-input {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: none;
      color: #fff;
      font-size: 11px;
      font-family: inherit;
      padding: 4px 6px;
      outline: none;
    }
    .profile-save-btn {
      padding: 4px 10px;
      background: #ff8700;
      border: none;
      color: #fff;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      flex-shrink: 0;
    }
    .profile-save-btn:hover { background: #fff; color: #000; }
    .profile-edit-status { font-size: 11px; color: #a0a0a0; margin-top: 4px; min-height: 14px; }
    .char-count { font-size: 10px; color: #808080; text-align: right; margin-top: 2px; }

    .login-section {
      padding: 14px 16px;
      text-align: center;
      color: #a0a0a0;
    }
    .login-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 16px;
      background: #ff8700;
      color: #fff;
      border-radius: 0;
      text-decoration: none;
      font-size: 13px;
    }
    .login-btn:hover { background: #fff; color: #000; }

    .actions {
      padding: 4px 12px 6px;
      display: flex;
      gap: 6px;
    }
    .action-btn {
      flex: 1;
      padding: 4px;
      background: rgba(255,255,255,0.06);
      border: none;
      border-radius: 0;
      color: #a0a0a0;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .action-btn:hover { background: #fff; color: #000; }

    /* section titles */
    .section-title {
      font-size: 10px;
      color: #ff8700;
      text-transform: lowercase;
      padding: 2px 12px 1px;
      background: rgba(255,135,0,0.06);
      border-bottom: 1px solid rgba(255,135,0,0.18);
      display: flex;
      align-items: center;
      gap: 6px;
      line-height: 1.4;
    }
    /* live following */
    .live-section { padding: 0; }
    .live-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 1px 12px;
      cursor: pointer;
      text-decoration: none;
      color: #ddd;
      line-height: 1.4;
    }
    .live-row:hover { background: rgba(255,135,0,0.08); }
    .live-dot {
      width: 5px; height: 5px; border-radius: 50%; background: #f00;
      flex-shrink: 0;
    }
    .live-avatar {
      width: 16px; height: 16px;
      background: rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .live-name { font-size: 11px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .live-viewers { font-size: 10px; color: #a0a0a0; flex-shrink: 0; }
    .live-empty { padding: 2px 12px; font-size: 11px; color: #808080; }

    /* leaderboards */
    .lb-section { padding: 0; }
    .lb-tabs {
      display: flex;
      gap: 0;
      padding: 1px 12px 1px;
    }
    .lb-tab {
      font-size: 10px;
      padding: 1px 6px;
      cursor: pointer;
      color: #808080;
      background: none;
      border: none;
      font-family: inherit;
    }
    .lb-tab.active { color: #ff8700; border-bottom: 1px solid #ff8700; }
    .lb-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 1px 12px;
      cursor: pointer;
      text-decoration: none;
      color: #ddd;
      line-height: 1.4;
    }
    .lb-row:hover { background: rgba(255,135,0,0.08); }
    .lb-rank { font-size: 10px; color: #808080; width: 14px; flex-shrink: 0; text-align: right; }
    .lb-avatar {
      width: 16px; height: 16px;
      background: rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .lb-name { font-size: 11px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lb-heat { font-size: 10px; color: #ff8700; flex-shrink: 0; }
    .lb-empty { padding: 2px 12px; font-size: 11px; color: #808080; }

    .sep { border: none; margin: 0; }

    .popout-section { padding: 6px 12px 10px; }
    .popout-row { display: flex; gap: 8px; }
    .popout-input {
      flex: 1;
      padding: 8px;
      background: #fff;
      color: #000;
      border: 1px solid #808080;
      font-size: 12px;
      font-family: inherit;
      outline: none;
    }
    .popout-input::placeholder { color: #b0b0b0; }
    .popout-btn { flex-shrink: 0; }

    /* bookmarks */
    .bm-section { padding: 0; }
    .bm-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding: 1px 12px;
      cursor: pointer;
      color: #ddd;
      text-decoration: none;
      line-height: 1.4;
    }
    .bm-row:hover { background: rgba(255,135,0,0.08); }
    .bm-ts { font-size: 10px; color: #808080; flex-shrink: 0; }
    .bm-channel { font-size: 10px; color: #ff8700; flex-shrink: 0; }
    .bm-content { font-size: 11px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bm-empty { padding: 2px 12px; font-size: 11px; color: #808080; }
    .bm-viewall { display: block; padding: 1px 12px; font-size: 10px; color: #808080; text-decoration: none; }
    .bm-viewall:hover { color: #ff8700; }

    /* live now */
    .livenow-section { padding: 0; }
    .livenow-toggle {
      font-size: 10px;
      color: #808080;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0 4px;
      font-family: inherit;
      margin-left: 4px;
    }
    .livenow-toggle:hover { color: #ff8700; }
    .livenow-toggle.active { color: #ff8700; border-bottom: 1px solid #ff8700; }
    .livenow-cat-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 1px 12px;
      cursor: pointer;
      color: #ddd;
      line-height: 1.4;
    }
    .livenow-cat-row:hover { background: rgba(255,135,0,0.08); }
    .livenow-cat-thumb {
      width: 14px; height: 18px; object-fit: cover; flex-shrink: 0;
      background: rgba(255,255,255,0.06);
    }
    .livenow-cat-name { font-size: 11px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .livenow-cat-count { font-size: 10px; color: #a0a0a0; flex-shrink: 0; }
    .livenow-back {
      font-size: 10px;
      color: #808080;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0 12px;
      font-family: inherit;
      display: block;
    }
    .livenow-back:hover { color: #ff8700; }

    /* referrals */
    .ref-section { padding: 0; }
    .ref-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 1px 12px;
      line-height: 1.4;
    }
    .ref-code { font-size: 11px; color: #ddd; font-family: monospace; flex: 1; }
    .ref-uses { font-size: 10px; color: #808080; flex-shrink: 0; }
    .ref-copy {
      font-size: 10px;
      color: #a0a0a0;
      background: rgba(255,255,255,0.06);
      border: none;
      cursor: pointer;
      padding: 0 6px;
      font-family: inherit;
      flex-shrink: 0;
    }
    .ref-copy:hover { color: #ff8700; }
    .ref-empty { padding: 2px 12px; font-size: 11px; color: #808080; }
    .ref-empty a { color: #ff8700; text-decoration: none; }
    .ref-empty a:hover { text-decoration: underline; }

    .hint {
      padding: 10px 16px;
      text-align: center;
      color: #a0a0a0;
      font-size: 11px;
      border-top: 1px solid rgba(255,255,255,0.12);
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon-48.png" alt="">
    <span class="header-title" data-i18n="popup_title">heatsync</span>
    <span class="status-dot yellow" id="status-dot" role="status" aria-live="polite" aria-label="status: checking" data-i18n-title="popup_status_checking" title="checking..."></span>
  </div>

  <div class="search-section">
    <input type="text" class="search-input" id="search-input" placeholder="search emotes, users..." spellcheck="false" autocomplete="off">
    <div class="search-dropdown" id="search-dropdown"></div>
  </div>

  <div id="content"></div>

  <hr class="sep">

  <div class="popout-section">
    <div class="popout-row">
      <input type="text" class="popout-input" id="popout-input" data-i18n-placeholder="popup_channel_placeholder" placeholder="channel" spellcheck="false">
      <button class="action-btn popout-btn" id="popout-btn" data-i18n="popup_btn_popout">popout</button>
    </div>
  </div>
  <div class="hint" data-i18n="popup_hint">emote settings in picker panel on chat</div>

  <script src="popup.js"></script>
</body>
</html>
