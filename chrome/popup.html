<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=300">
  <title>heatsync</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #0a0a0a; }
    body {
      width: 300px;
      color: #f0f0f0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace, 'Noto Color Emoji';
      font-size: 14px;
      line-height: 1.4;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .header img { width: 22px; height: 22px; }
    .brand {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .body { padding: 16px; }

    .input {
      width: 100%;
      padding: 10px 12px;
      background: #fff;
      color: #000;
      border: 1px solid #1a1a1a;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }
    .input::placeholder { color: #999; }
    .input:focus { border-color: #ff8700; }

    .btn {
      width: 100%;
      margin-top: 10px;
      padding: 10px 12px;
      background: #ff8700;
      color: #000;
      border: none;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.3px;
    }
    .btn:hover { background: #fff; color: #000; }
    .btn:active { background: #e87800; }

    .detected {
      margin-top: 12px;
      font-size: 12px;
      color: #888;
      text-align: center;
      min-height: 16px;
    }
    .detected b { color: #ff8700; font-weight: 600; }

    .footer {
      display: flex;
      gap: 0;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .footer a {
      flex: 1;
      padding: 10px 12px;
      color: #888;
      font-size: 12px;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
    }
    .footer a + a { border-left: 1px solid rgba(255,255,255,0.06); }
    .footer a:hover { background: #fff; color: #000; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon-48.png" alt="">
    <span class="brand">heatsync</span>
  </div>

  <div class="body">
    <input type="text" class="input" id="popout-input" placeholder="channel or url" spellcheck="false" autocomplete="off">
    <button class="btn" id="popout-btn">popout chat</button>
    <div class="detected" id="detected"></div>
  </div>

  <div class="footer">
    <a id="link-site" href="https://heatsync.org" target="_blank" rel="noopener noreferrer">heatsync.org</a>
    <a id="link-options" href="#">settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
