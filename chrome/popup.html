<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=300">
  <title>heatsync</title>
  <style>
    @font-face {
      font-family: 'CozetteVector';
      src: url('fonts/CozetteVector.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #000; }
    body {
      width: 300px;
      color: #fff;
      font-family: 'CozetteVector', monospace, 'Noto Color Emoji';
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: none;
      font-smooth: never;
      text-rendering: optimizeSpeed;
      font-kerning: normal;
      font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid #1c1c1c;
    }
    .header img { width: 22px; height: 22px; }
    .brand {
      font-size: 14px;
      font-weight: 400;
    }

    .body { padding: 12px 16px; }

    .input {
      width: 100%;
      padding: 10px 12px;
      background: #000;
      color: #fff;
      border: 1px solid #808080;
      border-radius: 0;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }
    .input::placeholder { color: #aaa; }
    .input:focus { border-color: #ff8700; }

    .btn {
      width: 100%;
      margin-top: 10px;
      padding: 10px 12px;
      background: #ff8700;
      color: #000;
      border: none;
      font-size: 14px;
      font-weight: 400;
      font-family: inherit;
      cursor: pointer;
    }
    .btn:hover { background: #fff; color: #000; }
    .btn:active { background: #fff; color: #000; }

    .detected {
      margin-top: 12px;
      font-size: 13px;
      color: #888;
      text-align: center;
      min-height: 16px;
    }
    .detected b { color: #ff8700; font-weight: 400; }

    .not-signed-in {
      margin-bottom: 12px;
      padding: 10px 12px;
      background: rgba(255, 135, 0, 0.1);
      border: 1px solid rgba(255, 135, 0, 0.3);
      font-size: 13px;
      color: #bbb;
      text-align: center;
    }
    .not-signed-in a {
      color: #ff8700;
      text-decoration: underline;
    }
    .not-signed-in a:hover {
      color: #fff;
    }

    .lite-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-top: 1px solid #1c1c1c;
      cursor: pointer;
      user-select: none;
    }
    .lite-row:hover { background: #fff; color: #000; }
    .lite-pill {
      width: 16px;
      height: 16px;
      background: #d70000;
      border: none;
      flex-shrink: 0;
      cursor: pointer;
      padding: 0;
    }
    .lite-pill.active { background: #00d700; }
    .lite-hint {
      padding: 0 16px 10px;
      font-size: 11px;
      color: #888;
      display: none;
    }
    .lite-hint.visible { display: block; }

    .footer {
      display: flex;
      border-top: 1px solid #1c1c1c;
    }
    .footer a {
      flex: 1;
      padding: 10px 12px;
      color: #888;
      font-size: 13px;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
    }
    .footer a + a { border-left: 1px solid #1c1c1c; }
    .footer a:hover { background: #fff; color: #000; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon-48.png" alt="">
    <span class="brand">heatsync</span>
  </div>

  <div class="body">
    <div class="not-signed-in" id="not-signed-in" hidden>
      <span data-i18n="popup_not_signed_in">not signed in — </span><a href="#" id="setup-link" data-i18n="popup_setup_link">set up heatsync →</a>
    </div>
    <input type="text" class="input" id="popout-input" placeholder="channel or url" data-i18n-ph="popup_channel_placeholder" spellcheck="false" autocomplete="off">
    <button class="btn" id="popout-btn" data-i18n="popup_btn_popout">popout chat</button>
    <div class="detected" id="detected"></div>
  </div>


  <div class="footer">
    <a id="link-site" href="https://heatsync.org" target="_blank" rel="noopener noreferrer">heatsync.org</a>
    <a id="link-privacy" href="https://heatsync.org/legal/privacy" target="_blank" rel="noopener noreferrer">no third-party tracking</a>
    <a id="link-errors" href="#" title="left-click: copy last 50 errors / right-click: clear" data-i18n-title="popup_errors_title">errors (0)</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
