<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>heatsync</title>
  <style>
    @font-face {
      font-family: 'CozetteVector';
      src: url('fonts/CozetteVector.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'CozetteVector', monospace, 'Noto Color Emoji';
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: none;
      font-smooth: never;
      text-rendering: optimizeSpeed;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    a { color: #fff; text-decoration: underline; }
    a:hover, a:focus-visible { background: #fff; color: #000; outline: none; }
  </style>
</head>
<body>
  <div>
    heatsync installed. go to <a href="https://heatsync.org" target="_blank">heatsync.org</a> to link your account.
  </div>
</body>
</html>
