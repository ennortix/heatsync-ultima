<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="welcome_title">heatsync</title>
  <style>
    @font-face {
      font-family: 'CozetteVector';
      src: url('fonts/CozetteVector.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: 'CozetteVector', monospace, 'Noto Color Emoji';
      font-size: 13px;
      -webkit-font-smoothing: none;
      font-smooth: never;
      text-rendering: optimizeSpeed;
    }
    .grid {
      display: grid;
      grid-template-rows: 1fr auto;
      height: 100vh;
      height: 100dvh;
    }
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 24px;
    }
    .logo-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .logo-img {
      width: 96px;
      height: 96px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .logo-word {
      font-size: 26px;
      line-height: 26px;
      color: #ff8700;
      font-weight: normal;
      user-select: none;
    }
    .tagline {
      text-align: center;
      color: #808080;
    }
    .cta {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .btn-p {
      padding: 10px 28px;
      font-family: 'CozetteVector', monospace;
      font-size: 13px;
      text-decoration: none;
      border: 1px solid #ff8700;
      background: #ff8700;
      color: #000;
    }
    .btn-p:hover { background: #fff; color: #000; border-color: #fff; }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 16px;
      border-top: 1px solid #333;
      color: #555;
      gap: 16px;
    }
    .footer-links {
      display: flex;
      gap: 16px;
      margin-left: auto;
    }
    .footer-links a {
      color: #555;
      text-decoration: none;
      padding: 2px 4px;
    }
    .footer-links a:hover { background: #fff; color: #000; }
    a:focus-visible { outline: 2px solid #ff8700; outline-offset: 2px; }
    @media (max-width: 640px) {
      .logo-img { width: 72px; height: 72px; }
      .cta { flex-direction: column; width: 100%; max-width: 280px; }
      .btn-p { text-align: center; width: 100%; }
      .footer { flex-wrap: wrap; justify-content: center; }
      .footer-links { margin-left: 0; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="hero" role="main">
      <div class="logo-block">
        <img class="logo-img" src="icon-128.png" alt="heatsync" width="96" height="96">
        <h1 class="logo-word">heatsync</h1>
      </div>
      <p class="tagline" data-i18n="welcome_tagline">twitch + kick + youtube, one chat</p>
      <div class="cta">
        <a href="https://heatsync.org" target="_blank" class="btn-p" data-i18n="welcome_cta">open heatsync.org</a>
      </div>
    </div>
    <div class="footer" role="contentinfo">
      <span id="footer-year"></span>
      <div class="footer-links">
        <a href="https://heatsync.org/legal/privacy" target="_blank" data-i18n="welcome_privacy">privacy</a>
        <a href="https://github.com/mellen9999/heatsync-extension" target="_blank" data-i18n="welcome_source">source</a>
      </div>
    </div>
  </div>
  <script>
    document.getElementById('footer-year').textContent = '© ' + new Date().getFullYear()
  </script>
  <script src="i18n-override.js"></script>
  <script src="welcome.js"></script>
</body>
</html>
